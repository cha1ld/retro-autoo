<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGENDS | Ретро-автомобили</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Анимации -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --bg: #050505;
            --card-bg: #0e0e0e;
            --gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #888888;
            --font-head: 'Cinzel', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: var(--font-head); color: var(--gold); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* --- HERO --- */
        header {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            border-bottom: 1px solid #222;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* --- CATALOG --- */
        .catalog-section { padding: 80px 0; }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 60px;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--gold);
            margin: 15px auto 0;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* --- CAR CARD --- */
        .car-card {
            background: var(--card-bg);
            border: 1px solid #222;
            transition: all 0.4s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .img-container {
            height: 240px;
            overflow: hidden;
            position: relative;
            background: #111;
        }

        .car-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .car-card:hover .car-img { transform: scale(1.05); }

        .card-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .car-name { font-size: 1.4rem; margin-bottom: 5px; line-height: 1.3; }
        .car-year { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; font-style: italic; }

        .price-row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid #222;
        }

        .price-label { font-size: 0.8rem; color: var(--text-muted); }
        .price-value { font-size: 1.3rem; color: var(--gold); font-family: var(--font-head); font-weight: 700; }

        .btn-select {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-select:hover { background: var(--gold); color: #000; }

        /* --- FORM --- */
        .booking-section {
            background: #080808;
            padding: 80px 0;
            border-top: 1px solid #111;
        }

        .form-wrapper {
            max-width: 500px;
            margin: 0 auto;
            background: #111;
            padding: 40px;
            border: 1px solid #222;
        }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--gold); 
            font-size: 0.9rem; 
            font-family: var(--font-head);
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #050505;
            border: 1px solid #333;
            color: white;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, select:focus { border-color: var(--gold); }

        /* --- MODAL (SUCCESS POPUP) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #0e0e0e;
            border: 1px solid var(--gold);
            padding: 40px;
            max-width: 400px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 20px;
            display: block;
        }

        .modal-title {
            font-family: var(--font-head);
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .modal-text {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .modal-close-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-family: var(--font-head);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            width: 100%;
        }

        .modal-close-btn:hover {
            background: #fff;
        }

        @media (max-width: 768px) {
            .cars-grid { grid-template-columns: 1fr; }
            .hero-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1 class="hero-title">Legends Garage</h1>
            <p class="hero-subtitle">Аренда коллекционных автомобилей</p>
        </div>
    </header>

    <section class="catalog-section">
        <div class="container">
            <h2 class="section-title">Наш Автопарк</h2>
            <div class="cars-grid" id="cars-grid">
                <!-- Сюда JavaScript вставит машины -->
            </div>
        </div>
    </section>

    <section class="booking-section" id="booking">
        <div class="container">
            <div class="form-wrapper">
                <h2 style="text-align: center; margin-bottom: 30px; font-size: 1.8rem;">Забронировать дату</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label>Автомобиль</label>
                        <select id="car-select" required>
                            <option value="">Выберите автомобиль...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Ваш телефон</label>
                        <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" required>
                    </div>

                    <div class="form-group">
                        <label>Дата аренды</label>
                        <input type="date" required>
                    </div>

                    <button type="submit" class="btn-select" style="background: var(--gold); color: black; font-weight: bold; margin-top: 10px;">Подтвердить бронирование</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Всплывающее окно успеха -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <span class="modal-icon">✓</span>
            <h3 class="modal-title">Заявка принята!</h3>
            <p class="modal-text">Спасибо за выбор Legends Garage. Наш менеджер свяжется с вами в течение 15 минут для подтверждения деталей.</p>
            <button class="modal-close-btn" onclick="closeModal()">Отлично</button>
        </div>
    </div>

    <footer style="text-align: center; padding: 30px; color: #444; font-size: 0.8rem; border-top: 1px solid #111;">
        &copy; 2024 Legends Garage. Все права защищены.
    </footer>

<script>
    // --- ДАННЫЕ: МАШИНЫ И ЗАГЛУШКИ ---
    // Используем сервис placehold.co — он генерирует картинки кодом. 
    // Никаких внешних фото, никаких блокировок. 100% загрузка.
    const cars = [
        { name: "Ford Mustang Shelby GT500", year: "1967", price: "35 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Mustang+GT500&font=playfair-display" },
        { name: "Chevrolet Corvette C2", year: "1965", price: "40 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Corvette+C2&font=playfair-display" },
        { name: "Mercedes-Benz 280 SL", year: "1970", price: "45 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Mercedes+280SL&font=playfair-display" },
        { name: "Porsche 911 Carrera", year: "1973", price: "55 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Porsche+911&font=playfair-display" },
        { name: "Jaguar E-Type", year: "1968", price: "50 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Jaguar+E-Type&font=playfair-display" },
        { name: "Cadillac DeVille", year: "1959", price: "38 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Cadillac+DeVille&font=playfair-display" },
        { name: "Volkswagen Beetle", year: "1966", price: "18 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=VW+Beetle&font=playfair-display" },
        { name: "Rolls-Royce Silver Shadow", year: "1975", price: "65 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Rolls-Royce&font=playfair-display" },
        { name: "Chevrolet Bel Air", year: "1957", price: "32 000 ₽ / день", image: "https://placehold.co/600x400/1a1a1a/d4af37?text=Bel+Air+1957&font=playfair-display" }
    ];

    // --- ОТРИСОВКА ---
    const grid = document.getElementById('cars-grid');
    const select = document.getElementById('car-select');

    cars.forEach(car => {
        const card = document.createElement('div');
        card.className = 'car-card';
        // Убрал onerror, так как заглушки работают всегда
        card.innerHTML = `
            <div class="img-container">
                <img src="${car.image}" alt="${car.name}" class="car-img" loading="lazy">
            </div>
            <div class="card-content">
                <h3 class="car-name">${car.name}</h3>
                <p class="car-year">Год выпуска: ${car.year}</p>
                <div class="price-row">
                    <span class="price-label">Аренда:</span>
                    <span class="price-value">${car.price}</span>
                </div>
                <button class="btn-select" onclick="selectCar('${car.name}')">Выбрать</button>
            </div>
        `;
        grid.appendChild(card);

        const option = document.createElement('option');
        option.value = car.name;
        option.textContent = `${car.name} (${car.year})`;
        select.appendChild(option);
    });

    // --- ФУНКЦИИ ---
    function selectCar(name) {
        select.value = name;
        document.getElementById('booking').scrollIntoView({ behavior: 'smooth' });
        
        gsap.fromTo(".form-wrapper", 
            { borderColor: "#222" }, 
            { borderColor: "#d4af37", duration: 0.5, yoyo: true, repeat: 1 }
        );
    }

    // Маска телефона
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', function (e) {
        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
        if (!x[2]) { e.target.value = x[1] ? '+7' : ''; return; }
        e.target.value = !x[2] ? x[1] : '+7 (' + x[2] + (x[3] ? ') ' + x[3] : '') + (x[4] ? '-' + x[4] : '') + (x[5] ? '-' + x[5] : '');
    });
    phoneInput.addEventListener('focus', function(e) { if (!e.target.value) e.target.value = '+7'; });

    // Модальное окно
    const modal = document.getElementById('successModal');
    const form = document.getElementById('bookingForm');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        modal.classList.add('active');
        form.reset();
    });

    function closeModal() {
        modal.classList.remove('active');
    }

    modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
    });

    // Анимация появления
    gsap.registerPlugin(ScrollTrigger);
    gsap.utils.toArray('.car-card').forEach((card, i) => {
        gsap.from(card, {
            scrollTrigger: { trigger: card, start: "top 90%" },
            y: 40, opacity: 0, duration: 0.6, delay: i % 3 * 0.1
        });
    });
</script>

</body>
</html>
